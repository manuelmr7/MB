<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscador MED</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        mark { background: #fff1a8; }
        #status { margin: 1rem 0 .5rem; color: rgb(0, 255, 0); }
        .doc { border-bottom: 1px solid #ddd; padding: .8rem 0; }
        .doc h3 { margin: 0 0 .2rem; font-size: 1.05rem; }
        .info { color: rgb(0, 0, 255); font-size: .85rem; margin-bottom: .4rem; }
        .doc p { margin: 0; }
        nav { display: flex; gap: .3rem; justify-content: center; flex-wrap: wrap; margin: 1.25rem 0; }
        nav button.current { background: #2457d6; color: #fff; }
    </style>
</head>
<body>
    <h1>Buscador MED</h1>

    <form id="form">
        <input type="search" id="query" size="50" placeholder="Consulta en inglés...">
        <button type="submit">Buscar</button>
    </form>

    <div id="status"></div>
    <div id="resultados"></div>
    <nav id="paginacion"></nav>

    <script>
        const $ = id => document.getElementById(id);
        const PAGE_SIZE = 10;

        $('form').addEventListener('submit', e => { e.preventDefault(); buscar(1); });

        async function buscar(page) {
            const q = $('query').value.trim();
            if (!q) return;
            $('status').textContent = 'Buscando…';
            try {
                const resp = await fetch(`/api/query?q=${encodeURIComponent(q)}&page=${page}&size=${PAGE_SIZE}`);
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || resp.status);
                pintar(data);
            } catch (err) {
                $('status').textContent = err.message;
            }
        }

        function pintar(data) {
            const cont = $('resultados');
            cont.innerHTML = '';

            if (data.total === 0) {
                $('status').textContent = 'No se encontraron resultados.';
                $('paginacion').innerHTML = '';
                return;
            }

            $('status').textContent = `${data.total} resultados`;

            data.docs.forEach(doc => {
                const div = document.createElement('div');
                div.className = 'doc';
                // titleHtml y snippetHtml ya vienen escapados desde el servidor
                div.innerHTML = `<h3>${doc.titleHtml}</h3>
                    <div class="info">Doc ${doc.id} · score ${doc.score?.toFixed(2)}</div>
                    <p>${doc.snippetHtml}</p>`;
                cont.appendChild(div);
            });

            pintarPaginacion(data);
        }

        function pintarPaginacion(data) {
            const nav = $('paginacion');
            nav.innerHTML = '';
            if (data.totalPages <= 1) return;

            const boton = (texto, page, opts = {}) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = texto;
                if (opts.current) b.classList.add('current');
                if (opts.disabled) b.disabled = true;
                else b.addEventListener('click', () => buscar(page));
                return b;
            };

            nav.appendChild(boton('‹ Anterior', data.page - 1, { disabled: data.page === 1 }));

            const ini = Math.max(1, data.page - 2);
            const fin = Math.min(data.totalPages, data.page + 2);
            for (let p = ini; p <= fin; p++) {
                nav.appendChild(boton(String(p), p, { current: p === data.page }));
            }

            nav.appendChild(boton('Siguiente ›', data.page + 1, { disabled: data.page === data.totalPages }));
        }
    </script>
</body>
</html>
